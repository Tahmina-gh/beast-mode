<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="csrf-token" content="{{ csrf_token() }}">
<meta name="theme-color" content="#0a0a0b">
<title>{% block title %}{{ gym_name }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a0b'/%3E%3Ctext x='50' y='68' font-size='60' font-family='Impact,sans-serif' fill='%23ff6a1a' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
{% block extra_css %}{% endblock %}
</head>
<body>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% if msgs %}
  <div style="position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:500; width:min(92vw,420px); display:flex; flex-direction:column; gap:8px;">
    {% for cat, msg in msgs %}
    <div class="flash {{ 'error' if cat=='error' else ('info' if cat=='info' else 'ok') }}">{{ msg }}</div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
